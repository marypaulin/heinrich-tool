[project]
name = "heinrich-tool"
version = "0.1.0"
description = "Erzeugt Angebote, Lieferscheine und Rechnungen aus der Zeiterfassung"
requires-python = ">=3.14"
dependencies = [
    "docx2pdf>=0.1.8",
    "python-docx>=1.2.0",
    "streamlit>=1.65.0",
    "pywin32; sys_platform == 'win32'",
    "platformdirs>=4.13.6",
]

[dependency-groups]
demo = ["PySide6>=6.11.2"]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["TID252"]
ignore = [
    "DTZ",     # naive local dates are intentional (German invoicing, no timezones)
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"demo/**" = [
    "BLE001",  # prototypes catch broadly on purpose
    "B008",    # Qt APIs require QModelIndex() as a default argument
]
