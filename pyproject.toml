[project]
name = "heinrich-app"
version = "0.1.0"
description = "Erzeugt Angebote, Lieferscheine und Rechnungen aus der Zeiterfassung"
requires-python = ">=3.14"
dependencies = [
    "docx2pdf==0.1.8",
    "python-docx==1.2.0",
    "streamlit==1.52.1",
    "pywin32; sys_platform == 'win32'",
]

[dependency-groups]
demo = ["PySide6==6.11.2"]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
ignore = [
    "LOG015",  # project currently logs via the root logger throughout; switching to
               # getLogger(__name__) is a deliberate refactor, not a lint fix
    "DTZ",     # naive local dates are intentional (German invoicing, no timezones)
]

[tool.ruff.lint.per-file-ignores]
"demo/**" = [
    "BLE001",  # prototypes catch broadly on purpose
    "B008",    # Qt APIs require QModelIndex() as a default argument
]
"src/backend/pdfgen.py" = [
    "BLE001",  # catch-all around Word/LibreOffice subprocess failures is intentional
]
